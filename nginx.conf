# Версия файла: 1.0.0
# Описание: Конфигурация Nginx для проксирования запросов на бота mp_seller_bot
# Дата изменения: 2025-12-27

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        # Укажите ваш домен и localhost (можно оставить только ваш домен)
        server_name mpsellerbot.kuzkabuh.ru localhost;

        # Проксирование всех запросов к приложению (порт 8000)
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /health перенаправляем на соответствующий эндпоинт приложения
        location /health {
            proxy_pass http://127.0.0.1:8000/health;
            proxy_set_header Host $host;
        }
    }
}

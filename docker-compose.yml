# Версия файла: 1.2.0
# Описание: Docker Compose для mp_seller_bot (db + redis + bot) без захвата 80/443.
#           HTTPS и публичные порты обслуживает внешний reverse-proxy (sellerapp_nginx).
# Дата изменения: 2025-12-28

services:
  db:
    image: postgres:16-alpine
    container_name: mp_seller_bot_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mp_seller_bot}
      POSTGRES_USER: ${POSTGRES_USER:-mpbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mpbot_password}
    volumes:
      - mp_seller_bot_pgdata:/var/lib/postgresql/data
    networks:
      - mp_seller_bot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mpbot} -d ${POSTGRES_DB:-mp_seller_bot}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mp_seller_bot_redis
    networks:
      - mp_seller_bot_net
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mp_seller_bot_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mp_seller_bot_app
    env_file:
      - .env
    environment:
      # Включаем webhook-режим
      WEBHOOK_ENABLED: "1"
      WEBHOOK_BASE_URL: "https://mpsellerbot.kuzkabuh.ru"
      WEBHOOK_LISTEN_HOST: "0.0.0.0"
      WEBHOOK_LISTEN_PORT: "8000"
      # WEBHOOK_SECRET хранится в .env (не хардкодим)

      # инфраструктура
      POSTGRES_HOST: "db"
      REDIS_HOST: "redis"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mp_seller_bot_net
    expose:
      - "8000"

    # Публикуем ТОЛЬКО на localhost хоста, чтобы внешний reverse-proxy мог проксировать внутрь
    # Можно выбрать любой свободный порт, например 28081:
    ports:
      - "127.0.0.1:28081:8000"
    restart: unless-stopped

networks:
  mp_seller_bot_net:
    driver: bridge

volumes:
  mp_seller_bot_pgdata:
  mp_seller_bot_redisdata:

# Версия файла: 1.1.0
# Описание: Docker Compose для mp_seller_bot (db + redis + bot + nginx + certbot) с HTTPS/webhook
# Дата изменения: 2025-12-28

services:
  db:
    image: postgres:16-alpine
    container_name: mp_seller_bot_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mp_seller_bot}
      POSTGRES_USER: ${POSTGRES_USER:-mpbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mpbot_password}
    volumes:
      - mp_seller_bot_pgdata:/var/lib/postgresql/data
    networks:
      - mp_seller_bot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mpbot} -d ${POSTGRES_DB:-mp_seller_bot}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mp_seller_bot_redis
    networks:
      - mp_seller_bot_net
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mp_seller_bot_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mp_seller_bot_app
    env_file:
      - .env
    environment:
      # ВАЖНО: включаем webhook-режим без правок в коде
      WEBHOOK_ENABLED: "1"
      WEBHOOK_BASE_URL: "https://mpsellerbot.kuzkabuh.ru"
      WEBHOOK_LISTEN_HOST: "0.0.0.0"
      WEBHOOK_LISTEN_PORT: "8000"
      # WEBHOOK_SECRET ДОЛЖЕН быть в .env (не хардкодим)
      POSTGRES_HOST: "db"
      REDIS_HOST: "redis"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mp_seller_bot_net
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: mp_seller_bot_nginx
    depends_on:
      - bot
    networks:
      - mp_seller_bot_net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Конфиг виртуального хоста
      - ./deploy/nginx/conf.d/mp_seller_bot.conf:/etc/nginx/conf.d/default.conf:ro

      # Webroot для ACME challenge
      - certbot_www:/var/www/certbot:ro

      # Сертификаты (read-only для nginx)
      - letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: mp_seller_bot_certbot
    networks:
      - mp_seller_bot_net
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    restart: unless-stopped
    entrypoint: /bin/sh
    command: >
      -c "trap exit TERM;
          while :; do
            sleep 12h & wait $${!};
            certbot renew --webroot -w /var/www/certbot --quiet;
          done"

networks:
  mp_seller_bot_net:
    driver: bridge

volumes:
  mp_seller_bot_pgdata:
  mp_seller_bot_redisdata:
  certbot_www:
  letsencrypt:

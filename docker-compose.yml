services:
  db:
    image: postgres:16-alpine
    container_name: mp_seller_bot_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mp_seller_bot}
      POSTGRES_USER: ${POSTGRES_USER:-mpbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mpbot_password}
    volumes:
      - mp_seller_bot_pgdata:/var/lib/postgresql/data
    networks:
      - mp_seller_bot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mpbot} -d ${POSTGRES_DB:-mp_seller_bot}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mp_seller_bot_redis
    networks:
      - mp_seller_bot_net
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mp_seller_bot_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mp_seller_bot_app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mp_seller_bot_net
    restart: unless-stopped
    expose:
      - "8000"   # webhook server внутри сети (nginx будет ходить сюда)

  nginx:
    image: nginx:1.27-alpine
    container_name: mp_seller_bot_nginx
    depends_on:
      - bot
    networks:
      - mp_seller_bot_net
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/nginx/log:/var/log/nginx

networks:
  mp_seller_bot_net:
    driver: bridge

volumes:
  mp_seller_bot_pgdata:
  mp_seller_bot_redisdata:

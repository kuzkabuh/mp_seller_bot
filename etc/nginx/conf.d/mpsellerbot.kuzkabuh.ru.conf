server {
    listen 80;
    server_name mpsellerbot.kuzkabuh.ru;

    # (опционально) ограничение размера тела запроса
    client_max_body_size 10m;

    # Healthcheck
    location = /health {
        proxy_pass http://127.0.0.1:8081/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ВАЖНО:
    # 1) Поддерживаем /webhook и /webhook/<secret> (и любые хвосты)
    # 2) Telegram будет стучаться POST'ом по точному URL, который вы установили через setWebhook
    location ^~ /webhook {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # По умолчанию не отдаём ничего лишнего
    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name mpsellerbot.kuzkabuh.ru;

    client_max_body_size 10m;

    # health endpoint
    location = /health {
        proxy_pass http://mp_seller_bot_app:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Telegram webhook endpoint
    location /webhook {
        proxy_pass http://mp_seller_bot_app:8000/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Telegram иногда шлёт быстро/часто
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Остальное — можно отдавать 404, чтобы не светить лишнее
    location / {
        return 404;
    }
}
